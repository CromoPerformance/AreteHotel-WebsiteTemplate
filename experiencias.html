<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiências | Hotel Aretê</title>
  <meta name="description" content="Experiências do Hotel Aretê em Búzios.">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Principal">
      <div class="nav-group left">
        <a class="nav-link" href="hotel.html">O Hotel</a>
        <a class="nav-link" href="acomodacoes.html">Acomodações</a>
      </div>
      <a class="brand" href="index.html" aria-label="Hotel Aretê Búzios">
        <img class="brand-logo brand-logo-white" src="assets/logos/191010_Marca_Hotel_Arete_Buzios_Vert_Mono.png" alt="Hotel Aretê Búzios">
        <img class="brand-logo brand-logo-blue" src="assets/logos/191010_Marca_Hotel_Arete_Buzios_Vert_RGB.png" alt="Hotel Aretê Búzios">
      </a>
      <div class="nav-group right">
        <a class="nav-link" href="buzios.html">Búzios</a>
        <a class="nav-link" href="experiencias.html" aria-current="page">Experiências</a>
        <a class="nav-link" href="blog.html">Blog</a>
        <a class="nav-cta" href="restaurante.html">Reservar</a>
      </div>
    </nav>
  </header>
  <main>
    <section class="hero hero-experiencias hero-subpage">
      <div class="hero-inner">
        <div class="hero-kicker">Experiências</div>
        <h1 class="hero-title">Vivenciar</h1>
        <p class="hero-subtitle">Momentos que viram memórias</p>
      </div>
      <div class="hero-scroll">
        <span class="hero-scroll-text">Descobrir</span>
        <div class="hero-scroll-line"></div>
      </div>
    </section>
  </main>
  <script>
    const header = document.querySelector('.site-header');
    function updateHeader() {
      if (window.scrollY > 80) { header.classList.add('scrolled'); }
      else { header.classList.remove('scrolled'); }
    }
    window.addEventListener('scroll', updateHeader, { passive: true });
    updateHeader();
  </script>
</body>
</html>
